name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_catalog:
        description: Compare the published source and skills.sh snapshot
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B scripts/check.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Build allowlisted package
        run: python -B scripts/package_skill.py --output "$RUNNER_TEMP/skill.zip"

  catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.check_catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Compare public contents without publishing
        run: python -B scripts/verify_distribution.py --github-ref "$SOURCE_REF" --catalog
        env:
          SOURCE_REF: ${{ github.sha }}
